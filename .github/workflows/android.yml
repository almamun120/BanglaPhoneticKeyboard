name: Android CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # tag-এ GitHub Release বানাতে লাগে

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------- ডিবাগ: প্রতিটি push/PR-এ টেস্ট + debug APK ----------
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Unit tests (typing engine)
        run: gradle test --stacktrace

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: bangla-keyboard-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  # ---------- সাইন্ড রিলিজ ----------
  # • v* ট্যাগ        → স্থায়ী GitHub Release (PopyKeyboard-<ভার্সন>.apk)
  # • main/master push → "latest" প্রি-রিলিজ আপডেট (প্রতিবার নতুন সাইন্ড APK)
  # • হাতে Run workflow → APK শুধু Artifacts-এ (main হলে latest-ও আপডেট)
  # Secret না থাকলেও চলে: প্রজেক্টের ভেতরের কী দিয়ে সাইন হয়।
  release:
    needs: debug
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
      IS_MAIN: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      # secret সেট থাকলে সেই কী দিয়ে সাইন; না থাকলে প্রজেক্টের ভেতরের কী (signing/popy-release.jks) দিয়ে সাইন।
      # দুই ক্ষেত্রেই কিছু করতে হয় না। নিজের গোপন কী চাইলে README-র "নিজের কী" অংশ দেখুন।
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          S_STOREPASS: ${{ secrets.KEYSTORE_PASSWORD }}
          S_ALIAS: ${{ secrets.KEY_ALIAS }}
          S_KEYPASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$S_STOREPASS" ] && [ -n "$S_ALIAS" ] && [ -n "$S_KEYPASS" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            {
              echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks"
              echo "KEYSTORE_PASSWORD=$S_STOREPASS"
              echo "KEY_ALIAS=$S_ALIAS"
              echo "KEY_PASSWORD=$S_KEYPASS"
            } >> "$GITHUB_ENV"
            echo "ব্যক্তিগত secret-কী দিয়ে সাইন করা হবে।"
          else
            {
              echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/signing/popy-release.jks"
              echo "KEYSTORE_PASSWORD=popykeyboard"
              echo "KEY_ALIAS=popy"
              echo "KEY_PASSWORD=popykeyboard"
            } >> "$GITHUB_ENV"
            echo "::notice::secret সেট নেই, প্রজেক্টের ভেতরের কী (signing/popy-release.jks) দিয়ে সাইন করা হচ্ছে।"
          fi

      - name: Set version
        run: |
          if [ "$IS_TAG" = "true" ]; then
            echo "VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
            echo "APK_NAME=PopyKeyboard-${GITHUB_REF_NAME#v}.apk" >> "$GITHUB_ENV"
          else
            echo "VERSION_NAME=dev-${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
            echo "APK_NAME=PopyKeyboard-latest.apk" >> "$GITHUB_ENV"
          fi
          echo "VERSION_CODE=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Build signed release APK
        run: gradle assembleRelease --stacktrace

      - name: Verify signature
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --verbose app/build/outputs/apk/release/*.apk

      - name: Name the APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk "dist/${APK_NAME}"

      - uses: actions/upload-artifact@v4
        with:
          name: popy-keyboard-release
          path: dist/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release (tag)
        if: env.IS_TAG == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true

      - name: Move "latest" tag
        if: env.IS_MAIN == 'true'
        run: |
          git tag -f latest
          git push -f origin latest

      - name: Publish "latest" pre-release
        if: env.IS_MAIN == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "সর্বশেষ বিল্ড (latest)"
          body: "main শাখার সর্বশেষ কমিটের সাইন্ড APK (স্বয়ংক্রিয়ভাবে আপডেট হয়)। স্থায়ী সংস্করণের জন্য নিচের নম্বরওয়ালা রিলিজ দেখুন।"
          prerelease: true
          make_latest: "false"
          files: dist/*.apk
